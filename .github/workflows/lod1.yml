name: lod1-trees
on:
  workflow_dispatch:
    inputs:
      group: { description: "voivodeship", default: "02" }
      limit: { description: "only first N chunks (0 = all)", default: "0" }

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install remotezip
      - id: m
        run: echo "matrix=$(python make_matrix.py '${{ inputs.group }}' 4e9 '${{ inputs.limit }}')" >> "$GITHUB_OUTPUT"

  run:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install numpy remotezip
      - run: python remote.py "${{ matrix.zip }}" ${{ matrix.start }} ${{ matrix.end }} "out/${{ matrix.id }}.ctl"
      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.id }}
          path: out/${{ matrix.id }}.ctl
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

  merge:
    needs: [prepare, run]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "out-*", path: chunks, merge-multiple: true }
      - run: pip install numpy
      - run: python merge.py chunks final
        env:
          MATRIX: ${{ needs.prepare.outputs.matrix }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lod1-${{ inputs.group }}-a${{ github.run_attempt }}
          path: final/
          retention-days: 90